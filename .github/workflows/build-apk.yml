name: Fabrication APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
  runs-on: ubuntu-latest
  steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Installation de Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Installation de Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Préparation et Compilation Android
      run: |
        npm install
        npx cap init "TACTICAL-PRO" "com.akd.tacticalpro" --web-dir www
        npx cap add android
        npx cap sync android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Sauvegarde de l'APK prêt à installer
      uses: actions/upload-artifact@v4
      with:
        name: TACTICAL-PRO-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
